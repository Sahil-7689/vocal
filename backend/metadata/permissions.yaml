# ============================================================
# VocalFlow — Hasura Row-Level Permissions
# Two-Layer Security Model
# ============================================================

table_permissions:

  # ── org_members ────────────────────────────────────────────────
  org_members:
    select:
      - role: user
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            user_id:
              _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            user_id:
              _eq: X-Hasura-User-Id

  # ── organizations ──────────────────────────────────────────────
  organizations:
    select:
      - role: user
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
    update:
      - role: user
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
          columns:
            - name
      - role: owner
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
          columns:
            - name

  # ── workflows ──────────────────────────────────────────────────
  workflows:
    select:
      - role: user
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

    insert:
      - role: user
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - org_id
            - name
            - description
            - status
            - created_by
      - role: owner
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - org_id
            - name
            - description
            - status
            - created_by
      - role: editor
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - org_id
            - name
            - description
            - status
            - created_by

    update:
      - role: user
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - name
            - description
            - status
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - name
            - description
            - status
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - name
            - description
            - status

    delete:
      - role: user
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

  # ── workflow_steps ─────────────────────────────────────────────
  workflow_steps:
    select:
      - role: user
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

    insert:
      - role: user
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - workflow_id
            - position
            - name
            - type
            - config
      - role: owner
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - workflow_id
            - position
            - name
            - type
            - config
      - role: editor
        permission:
          check:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - type:
                  _nin: ["db_write", "notify"]
          columns:
            - workflow_id
            - position
            - name
            - type
            - config

    update:
      - role: user
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - position
            - name
            - type
            - config
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - position
            - name
            - type
            - config
      - role: editor
        permission:
          filter:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - type:
                  _nin: ["db_write", "notify"]
          columns:
            - position
            - name
            - type
            - config

    delete:
      - role: user
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

  # ── workflow_triggers ──────────────────────────────────────────
  workflow_triggers:
    select:
      - role: user
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

    insert:
      - role: user
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - workflow_id
            - type
            - config
            - enabled
      - role: owner
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - workflow_id
            - type
            - config
            - enabled
      - role: editor
        permission:
          check:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - type:
                  _neq: "webhook"
          columns:
            - workflow_id
            - type
            - config
            - enabled

    update:
      - role: user
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - config
            - enabled
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - config
            - enabled

    delete:
      - role: user
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

  # ── workflow_runs ──────────────────────────────────────────────
  workflow_runs:
    select:
      - role: user
