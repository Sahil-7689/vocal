# ============================================================
# VocalFlow — Hasura Row-Level Permissions
# Two-Layer Security Model
# ============================================================
#
# LAYER 1 — Org + Role Scoping
# ─────────────────────────────
# Every permission filter chains through org_members.
# The authenticated identity comes exclusively from X-Hasura-User-Id
# (set by Nhost JWT — client cannot forge this).
#
# The invariant is:
#   resource.org_id → org_members.org_id → org_members.user_id = X-Hasura-User-Id
#
# This ensures an editor in Org A can NEVER read or write Org B data
# even if they know the UUID.
#
# LAYER 2 — Step-Level Gating
# ────────────────────────────
# Certain operations are privileged because they reach outside the
# workflow sandbox. These are enforced at INSERT/UPDATE check time:
#
#   db_write step    → owner only   (enforced via type _nin on editor INSERT)
#   notify step      → owner only   (same)
#   webhook trigger  → owner only   (enforced via type _neq on editor INSERT)
#
# approval_gate clearance is NOT a database permission — it is a
# runtime decision inside the approveStep Action handler, because
# it depends on mid-execution state (step_config.required_role).
#
# Role matrix implemented:
#
#   Operation              | owner | editor | viewer
#   ─────────────────────────────────────────────────
#   View own-org workflows |   ✅  |   ✅   |   ✅
#   Create workflow        |   ✅  |   ✅   |   ❌
#   Edit workflow          |   ✅  |   ✅   |   ❌
#   Delete workflow        |   ✅  |   ✅   |   ❌
#   Create normal step     |   ✅  |   ✅   |   ❌
#   Add db_write           |   ✅  |   ❌   |   ❌
#   Add notify             |   ✅  |   ❌   |   ❌
#   Create webhook trigger |   ✅  |   ❌   |   ❌
#   Trigger workflow       |   ✅  |   ✅   |   ❌  (Action)
#   View runs              |   ✅  |   ✅   |   ✅
#   Manage members         |   ✅  |   ❌   |   ❌
#   Approve gate           |   ✅  |   ❌   |   ❌  (Action, owner-only)
#   Access another org     |   ❌  |   ❌   |   ❌
# ============================================================

table_permissions:

  # ── org_members ────────────────────────────────────────────────
  # LAYER 1: Users may only read memberships in orgs they belong to.
  # Owner sees all org members (for member management UI).
  # Editor/Viewer see only their own membership row.
  # No client can INSERT/UPDATE/DELETE memberships — that is handled
  # exclusively by the createOrganization Action (owner assignment)
  # and future inviteUser / removeUser Actions.
  # ───────────────────────────────────────────────────────────────
  org_members:
    select:
      - role: owner
        permission:
          # Owner sees all members in their org(s).
          # Chain: org_members.org_id → organizations → members
          # Filter: orgs where the caller is also a member
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          # Editor sees only their own membership row
          filter:
            user_id:
              _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          # Viewer sees only their own membership row
          filter:
            user_id:
              _eq: X-Hasura-User-Id

  # ── organizations ──────────────────────────────────────────────
  # LAYER 1: A user may only read orgs where they are a member.
  # Even knowing the UUID of another org returns 0 rows.
  # Only owners can update org settings (name).
  # quota_allowed and quota_used are server-controlled — not in columns.
  # No role can delete an org via GraphQL (admin-only).
  # ───────────────────────────────────────────────────────────────
  organizations:
    select:
      - role: owner
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
    update:
      - role: owner
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
          columns:
            - name

  # ── workflows ──────────────────────────────────────────────────
  # LAYER 1:
  #   SELECT — all three roles see only their own org's workflows
  #   INSERT — owner + editor only
  #   UPDATE — owner + editor only
  #   DELETE — owner + editor (assignment: editor can delete)
  #
  # Note: viewer has no INSERT, UPDATE, or DELETE permission.
  # ───────────────────────────────────────────────────────────────
  workflows:
    select:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

    insert:
      - role: owner
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - org_id
            - name
            - description
            - status
            - created_by
      - role: editor
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - org_id
            - name
            - description
            - status
            - created_by

    update:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - name
            - description
            - status
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          columns:
            - name
            - description
            - status

    delete:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      # LAYER 1: Editor can also delete workflows (assignment requirement)
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      # viewer: no delete permission

  # ── workflow_steps ─────────────────────────────────────────────
  # LAYER 1:
  #   SELECT — all three roles see only steps in their org's workflows
  #   INSERT — owner + editor; viewer: denied
  #   UPDATE — owner + editor; viewer: denied
  #   DELETE — owner + editor; viewer: denied
  #
  # LAYER 2 (INSERT check):
  #   owner  — unrestricted (can add db_write, notify, any type)
  #   editor — blocked from inserting db_write or notify step types
  #            (type _nin enforced at INSERT and UPDATE check time)
  # ───────────────────────────────────────────────────────────────
  workflow_steps:
    select:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

    insert:
      - role: owner
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - workflow_id
            - position
            - name
            - type
            - config
      - role: editor
        permission:
          check:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              # ── LAYER 2: block db_write and notify for editors ──
              - type:
                  _nin: ["db_write", "notify"]
          columns:
            - workflow_id
            - position
            - name
            - type
            - config

    update:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - position
            - name
            - type
            - config
      - role: editor
        permission:
          filter:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              # ── LAYER 2: editor cannot change a step to a restricted type
              - type:
                  _nin: ["db_write", "notify"]
          columns:
            - position
            - name
            - type
            - config

    delete:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      # LAYER 1: Editor can delete steps (assignment requirement)
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      # viewer: no delete permission

  # ── workflow_triggers ──────────────────────────────────────────
  # LAYER 1:
  #   SELECT — all three roles see their org's triggers
  #   INSERT — owner: unrestricted; editor: blocked from webhook type
  #   UPDATE — owner only (trigger config is sensitive)
  #   DELETE — owner only
  #
  # LAYER 2 (INSERT check for editor):
  #   editor cannot create a webhook trigger (type _neq "webhook")
  # ───────────────────────────────────────────────────────────────
  workflow_triggers:
    select:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

    insert:
      - role: owner
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - workflow_id
            - type
            - config
            - enabled
      - role: editor
        permission:
          check:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              # ── LAYER 2: editor cannot create webhook triggers ──
              - type:
                  _neq: "webhook"
          columns:
            - workflow_id
            - type
            - config
            - enabled

    update:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
          columns:
            - config
            - enabled

    delete:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

  # ── workflow_runs ──────────────────────────────────────────────
  # LAYER 1: All roles see only runs for their own org's workflows.
  # No role can directly INSERT a workflow_run — runs are created
  # exclusively by the triggerWorkflowRun Action, which performs
  # its own Layer 1 + Layer 2 checks (viewer rejected, org verified).
  # No role can directly UPDATE or DELETE workflow_runs — all state
  # transitions (running → paused → completed) happen server-side.
  # ───────────────────────────────────────────────────────────────
  workflow_runs:
    select:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

  # ── step_runs ──────────────────────────────────────────────────
  # LAYER 1: All roles see only step_runs for their org's workflows.
  # No role can directly INSERT, UPDATE, or DELETE step_runs.
  # All step_run mutations (status, output, approved_by, approved_at)
  # are performed by Action handlers (triggerWorkflowRun / approveStep).
  # This prevents the approval bypass attack:
  #   mutation { update_step_runs(... status: completed approved_by: ...) }
  # ───────────────────────────────────────────────────────────────
  step_runs:
    select:
      - role: owner
        permission:
          filter:
            workflow_run:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow_run:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow_run:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id

  # ── workflow_results ───────────────────────────────────────────
  # LAYER 1: All roles see only results for their own org.
  # Results are written exclusively by the executeDbWrite helper
  # inside the triggerWorkflowRun / approveStep Action handlers.
  # ───────────────────────────────────────────────────────────────
  workflow_results:
    select:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
