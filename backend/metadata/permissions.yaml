                members:
                  user_id:
                    _eq: X-Hasura-User-Id

    insert:
      - role: owner
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          check:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - type:
                  _neq: "webhook"

  workflow_runs:
    select:
