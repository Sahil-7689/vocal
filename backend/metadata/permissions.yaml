      - role: viewer
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

  # ── organization_monthly_usage ─────────────────────────────────
  organization_monthly_usage:
    select:
      - role: user
        permission:
          filter:
            org_id:
              _in:
                _select:
                  table: org_members
                  column: org_id
                  where:
                    user_id:
                      _eq: X-Hasura-User-Id
      - role: owner
        permission:
          filter:
            org_id:
              _in:
