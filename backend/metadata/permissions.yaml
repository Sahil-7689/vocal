table_permissions:
  organizations:
    select:
      - role: owner
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            members:
              user_id:
                _eq: X-Hasura-User-Id

  workflows:
    select:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

    insert:
      - role: owner
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          check:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

    update:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

    delete:
      - role: owner
        permission:
          filter:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

  workflow_steps:
    select:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: viewer
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

    insert:
      - role: owner
        permission:
          check:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          check:
            _and:
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - type:
                  _nin: ["db_write", "notify"]

  workflow_triggers:
    select:
      - role: owner
        permission:
          filter:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      - role: editor
        permission:
          filter:
            workflow:
